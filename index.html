<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mt.BLUE FACTORY | Works</title>
  <style>
    /* ===== 見た目の設定(色や文字を変えたいときはここ) ===== */
    :root {
      --bg: #fafaf8;
      --text: #222;
      --sub: #777;
      --line: #ddd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      line-height: 1.8;
    }
    header, section, footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    h2 {
      font-size: 1.3rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
      margin-bottom: 24px;
    }
    nav a { margin-right: 16px; color: var(--sub); text-decoration: none; }
    nav a:hover { color: var(--text); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }
    .card img, .card .placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #e8e6e1;
      display: block;
    }
    .card h3 { margin: 12px 0 0; font-size: 1rem; }
    .card p { margin: 4px 0 0; color: var(--sub); font-size: 0.9rem; }
    footer { color: var(--sub); font-size: 0.85rem; }
  </style>
</head>
